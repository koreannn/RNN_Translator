[project]
name = "rnn-translator"
version = "0.1.0"
description = "PyTorch 기반 RNN Seq2Seq 한국어-영어 번역기"
requires-python = ">=3.11, <3.14"

dependencies = [
    # 딥러닝 코어
    "torch>=2.5.1",
    # HuggingFace 관련
    "transformers>=4.57.0",
    "datasets>=4.8.2",
    # 학습 모니터링
    "wandb>=0.25.0",
    # 평가 지표
    "sacrebleu>=2.6.0",
    # 유틸
    "pyyaml>=6.0.3",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "streamlit>=1.52.2",
    "matplotlib>=3.11.0",
    "triton>=3.2.0; sys_platform=='linux'",
    "vllm==0.8.5.post1; sys_platform == 'linux'", # torch 2.6.0과 호환되는 마지막 버전 (Qwen3 지원)
    "setuptools>=70,<81", # unbabel-comet → torchmetrics 0.10이 pkg_resources(81에서 제거)를 사용
    "mlflow>=3.16.1",
    "unbabel-comet>=2.2.7",
    "hf-transfer>=0.1.9",
    "boto3>=1.43.110",
    "psycopg[binary]>=3.3.6",
    "trl>=1.15.0",
    "peft>=0.21.2",
    "sentencepiece>=0.2.2",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true  # torch에만 적용, 나머지는 PyPI 사용

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'"},
]

# 프로젝트 자체를 editable 패키지로 설치 → 어디서 실행하든 `from src.xxx import` 가능
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
